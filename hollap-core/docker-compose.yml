services:
  postgres:
    image: postgres:16
    container_name: hollap-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hollap_core
    ports:
      - "5432:5432"
    volumes:
      - hollap_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hollap-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: hollap-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hollap_minio_data:/data

volumes:
  hollap_pg_data:
  hollap_minio_data:
