[images]
  remote_images = [
    "https://images.unsplash.com/.*",
    "https://ui-avatars.com/.*",
    "https://avatars.githubusercontent.com/.*",
    "https://lh3.googleusercontent.com/.*",
  ]

[build]
  command = "npm ci && npm run env:check:deploy && npm run db:migrate && npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-cache static assets; HTML stays revalidated by Next.js.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    # Security baseline. CSP intentionally permissive for /_next/* and inline
    # Stripe/Mux scripts — tighten per environment via custom edge function.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
