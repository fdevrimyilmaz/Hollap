name: Weekly Digest Cron

on:
  schedule:
    # Monday 06:00 UTC == 09:00 Europe/Istanbul.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly digest endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          INTERNAL_CRON_KEY: ${{ secrets.INTERNAL_CRON_KEY }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$INTERNAL_CRON_KEY" ]; then
            echo "INTERNAL_CRON_KEY secret is missing"
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST "${APP_BASE_URL}/api/internal/digest/send" \
            -H "x-internal-key: ${INTERNAL_CRON_KEY}" \
            -H "Content-Type: application/json"
