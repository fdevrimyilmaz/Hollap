name: CI

on:
  pull_request:
    branches: [main, auth-prod]
  push:
    branches: [main, auth-prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hollap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hollap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Required secrets for tests + boot validation. These are
      # deterministic test values, never used outside CI.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hollap
      APP_JWT_SECRET: ci-test-jwt-secret
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret
      PASSWORD_RESET_TOKEN_SECRET: ci-test-password-reset-secret
      EMAIL_VERIFICATION_TOKEN_SECRET: ci-test-email-verify-secret
      FILE_TOKEN_SECRET: ci-test-file-token-secret
      APP_BASE_URL: http://localhost:3000
      APP_ALLOWED_ORIGINS: http://localhost:3000
      OBJECT_STORAGE_DRIVER: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
