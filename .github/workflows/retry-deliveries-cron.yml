name: Retry Deliveries Cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger internal retry endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          INTERNAL_CRON_KEY: ${{ secrets.INTERNAL_CRON_KEY }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$INTERNAL_CRON_KEY" ]; then
            echo "INTERNAL_CRON_KEY secret is missing"
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST "${APP_BASE_URL}/api/internal/retry-deliveries" \
            -H "x-internal-key: ${INTERNAL_CRON_KEY}" \
            -H "Content-Type: application/json"
